name: Toffee Signed URL Cookie Scraper

on:
  schedule:
    - cron: '0 */2 * * *'  # প্রতি ২ ঘন্টায়
  workflow_dispatch:
    inputs:
      watch_url:
        description: 'Watch URL'
        required: true
        default: 'https://toffeelive.com/en/watch/Xi_Ga5oBNnOkwJLWkhKP'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Playwright
      run: |
        pip install playwright
        playwright install chromium
        
    - name: Run Scraper
      run: python scraper.py
      env:
        WATCH_URL: ${{ github.event.inputs.watch_url || 'https://toffeelive.com/en/watch/Xi_Ga5oBNnOkwJLWkhKP' }}
        
    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: signed-url-cookies
        path: |
          signed_url_cookies.json
          signed_url_cookies_raw.txt
          full_scrape_report.json
          
    - name: Commit to Repository
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add -A
        git commit -m "Update signed URL cookies - $(date)" || exit 0
        git push || exit 0
